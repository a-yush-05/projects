<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFlix</title>

  <!-- CSS file is in the same folder as index.html -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar" id="navbar">
    <a href="#" class="logo" data-view="home">STREAMFLIX</a>

    <button
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Toggle menu"
      aria-expanded="false"
    >
      &#9776;
    </button>

    <nav class="nav" id="nav" aria-label="Main navigation">
      <ul class="nav-links">
        <li>
          <a href="#" data-view="home" class="active">Home</a>
        </li>

        <li>
          <a href="#" data-view="movie">Movies</a>
        </li>

        <li>
          <a href="#" data-view="show">TV Shows</a>
        </li>

        <li>
          <a href="#" data-view="list">My List</a>
        </li>
      </ul>

      <form class="search-form" id="search-form">
        <label for="search-input" class="visually-hidden">
          Search titles
        </label>

        <input
          type="search"
          id="search-input"
          placeholder="Search titles"
          autocomplete="off"
        >

        <button
          type="button"
          class="clear"
          id="clear-search"
          aria-label="Clear search"
          hidden
        >
          &#10005;
        </button>
      </form>
    </nav>
  </header>

  <main>
    <section
      class="hero"
      id="hero"
      aria-label="Featured title"
    ></section>

    <div id="content"></div>
  </main>

  <footer class="footer">
    <p>
      &copy; 2026 StreamFlix.
    </p>
  </footer>

  <div class="modal" id="modal" hidden>
    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >

      <button
        class="modal-close"
        id="modal-close"
        aria-label="Close details"
      >
        &#10005;
      </button>

      <img id="modal-img" src="" alt="">

      <div class="modal-info">
        <h2 id="modal-title"></h2>

        <p id="modal-meta"></p>

        <p id="modal-desc"></p>

        <button
          class="btn btn-red"
          id="modal-list"
        ></button>
      </div>

    </div>
  </div>

  
  <script src="script.js"></script>

</body>
</html>
